services:
  postgres:
    image: postgres:18
    environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    volumes:
         - postgres_data:/var/lib/postgresql
  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      - postgres
    volumes:
      - .:/app
  redis:
    image: redis
volumes:
  postgres_data:
    external: true
